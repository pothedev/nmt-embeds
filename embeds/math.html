<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="frame">
  <div class="title">Math</div>

  <input id="val" type="number" placeholder="Points">

  <div id="out" class="out">—</div>

  <button onclick="calc()">Convert</button>
</div>

<script>
  const table = {
    5: 100, 6: 109, 7: 118, 8: 125, 9: 131,
    10: 134, 11: 137, 12: 140, 13: 143, 14: 145,
    15: 147, 16: 148, 17: 149, 18: 150, 19: 151,
    20: 152, 21: 156, 22: 160, 23: 164, 24: 166,
    25: 169, 26: 173, 27: 176, 28: 179, 29: 184,
    30: 189, 31: 194, 32: 200
  };

  function calc() {
    const v = parseInt(document.getElementById("val").value);
    document.getElementById("out").innerText = table[v] ?? "—";
  }
</script>

</body>
</html>
